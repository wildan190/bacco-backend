[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; ondemand: hanya spawn worker jika ada request, membebaskan RAM saat idle (<40MB)
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300

; Cegah worker menelan variabel environment sistem
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 60s
