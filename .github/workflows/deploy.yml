name: Build Image & Deploy to Coolify

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image in GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Image Name
        id: image_tag
        run: |
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_tag.outputs.image }}:latest
            ${{ steps.image_tag.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-coolify:
    name: Trigger Coolify Deploy (Pull & Run Only)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment via Coolify Webhook
        env:
          COOLIFY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
        run: |
          echo "🚀 Image berhasil di-build di GitHub Actions!"
          echo "📡 Mengirim sinyal ke Coolify untuk pull image & restart container..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://coolify.phoenixtech.web.id/api/v1/deploy?uuid=pq7c1alsxtbzru2iyhbl1kcv&force=false" \
            -H "Authorization: Bearer ${COOLIFY_SECRET}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Coolify berhasil diperintahkan untuk deploy (hanya pull image, tanpa compile di VPS)!"
          else
            echo "❌ Gagal memicu Coolify deploy (HTTP $HTTP_CODE)"
            exit 1
          fi
