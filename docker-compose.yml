services:
  app:
    image: ghcr.io/wildan190/bacco-backend:latest
    container_name: bacco-backend
    restart: unless-stopped
    env_file:
      - .env.production.example
    ports:
      - "${APP_PORT:-8008}:80"
    environment:
      APP_NAME: "${APP_NAME:-BaccoSales}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:OGth0tQGzl4SbKoBe4rHAu8UGossysxfmJmw/dsdQnk=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://api-bacco.phoenixtech.web.id}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-db_bacco_sales_track_app}"
      DB_USERNAME: "${DB_USERNAME:-bacco_user}"
      DB_PASSWORD: "${DB_PASSWORD:-bacco_secret}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single,stderr}"
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-s3}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-IEGGKPLA14XPJHR2AZZV}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-1gabnDE08W1VoeLfXuVEkzPx6J4aXbQp7HLJJcgY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-huntr-dev}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-https://s3.nevaobjects.id}"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      RUN_MIGRATIONS: "true"
    deploy:
      resources:
        limits:
          cpus: '0.70'
          memory: 450M
        reservations:
          cpus: '0.10'
          memory: 100M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - mysql
      - redis
    networks:
      - bacco-network

  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0
    container_name: bacco-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M --innodb-log-buffer-size=16M --max-connections=30
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 220M
        reservations:
          cpus: '0.10'
          memory: 100M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-bacco_root_secret} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-db_bacco_sales_track_app}"
      MYSQL_USER: "${DB_USERNAME:-bacco_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-bacco_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-bacco_root_secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bacco-network

  redis:
    image: public.ecr.aws/docker/library/redis:alpine
    container_name: bacco-redis
    restart: unless-stopped
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - bacco-network

volumes:
  mysql_data:
  redis_data:

networks:
  bacco-network:
    driver: bridge
